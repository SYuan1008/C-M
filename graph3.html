<!DOCTYPE html>
<html>
<head>
    <title>地图柱状图混合可视化</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map { 
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .bar-chart { 
            background: rgba(255,255,255,0.9); 
            padding: 5px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.3); 
        }
        .bar { 
            transition: height 0.3s; 
        }
        .ol-popup {
            position: fixed;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            min-width: 280px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="popup" class="ol-popup"></div>

    <script>
        // 地理坐标与数据绑定
        const countries = [
            { name: "中国", lat: 35.8617, lng: 104.1954, 
              data: [[45778.4, 58368.0], [43.9, 45.6]] },
            { name: "日本", lat: 36.2048, lng: 138.2529, 
              data: [[14666.0, 16449.3], [13.77, 11.6]] },
            { name: "韩国", lat: 36.5582, lng: 127.7902, 
              data: [[10449.6, 12741.1], [10.0, 9.8]] },
            { name: "新加坡", lat: 1.3521, lng: 103.8198, 
              data: [[7493.1, 8976.2], [7.2, 6.9]] },
            { name: "越南", lat: 14.0583, lng: 108.2772, 
              data: [[5180.5, 6894.0], [5.0, 5.3]] },
            { name: "澳大利亚", lat: -25.2744, lng: 133.7751, 
              data: [[4924.0, 6586.1], [4.7, 5.1]] }
        ];

        // 创建动态比例尺
        const maxTrade = d3.max(countries.flatMap(c => c.data[0]));
        const scale = d3.scaleLinear()
            .domain([0, maxTrade])
            .range([10, 40]);

        // 创建柱状图生成器
        function createBarChart(data) {
            const container = d3.create("div").classed("bar-chart", true);
            const svgWidth = 80;
            const barWidth = 25;
            const barSpacing = 5;

            const svg = container.append("svg")
                .attr("width", svgWidth)
                .attr("height", 100);

            const xPositions = [
                (svgWidth - (barWidth*2 + barSpacing)) / 2,
                (svgWidth - (barWidth*2 + barSpacing)) / 2 + barWidth + barSpacing
            ];

            svg.selectAll("rect")
                .data(data[0])
                .enter()
                .append("rect")
                .attr("x", (d,i) => xPositions[i])
                .attr("y", d => 60 - scale(d))
                .attr("width", barWidth)
                .attr("height", d => scale(d))
                .attr("fill", (d,i) => i===0 ? "#1f77b4" : "#ff7f0e");

            svg.append("text")
                .attr("x", xPositions[0] + barWidth/2)
                .attr("y", 85)
                .attr("text-anchor", "middle")
                .attr("class", "data-label")
                .style("fill", "#1f77b4")
                .style("font-size", "10px")
                .text(`${data[1][0]}%`);

            svg.append("text")
                .attr("x", xPositions[1] + barWidth/2)
                .attr("y", 85)
                .attr("text-anchor", "middle")
                .attr("class", "data-label")
                .style("fill", "#ff7f0e")
                .style("font-size", "10px")
                .text(`${data[1][1]}%`);

            return container.node();
        }

        // 生成弹窗内容
        function createPopupContent(country) {
            return `
                <div style="min-width: 180px">
                    <h4>${country.name}</h4>
                    <table>
                        <tr>
                            <th>年份</th>
                            <th>贸易额（亿美元）</th>
                            <th>份额</th>
                        </tr>
                        <tr>
                            <td>2019</td>
                            <td>${country.data[0][0].toLocaleString()}</td>
                            <td>${country.data[1][0]}%</td>
                        </tr>
                        <tr>
                            <td>2023</td>
                            <td>${country.data[0][1].toLocaleString()}</td>
                            <td>${country.data[1][1]}%</td>
                        </tr>
                    </table>
                </div>
            `;
        }

        try {
            // 初始化地图
            const map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: 'https://t1.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=a305b8590905e815f7c7cb0f2a781e92',
                            crossOrigin: 'anonymous'
                        })
                    }),
                    new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: 'https://t1.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=a305b8590905e815f7c7cb0f2a781e92',
                            crossOrigin: 'anonymous'
                        })
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([110, 15]),
                    zoom: 3,
                    projection: 'EPSG:3857'
                }),
                controls: [
                    new ol.control.Zoom(),
                    new ol.control.ScaleLine()
                ]
            });

            // 创建弹窗元素
            const popup = document.getElementById('popup');

            // 添加柱状图标记
            countries.forEach(country => {
                const marker = new ol.Overlay({
                    position: ol.proj.fromLonLat([country.lng, country.lat]),
                    element: createBarChart(country.data),
                    positioning: 'bottom-center'
                });

                // 添加点击事件
                marker.getElement().addEventListener('click', (event) => {
                    const mapElement = document.getElementById('map');
                    const rect = mapElement.getBoundingClientRect();
                    const markerRect = event.target.getBoundingClientRect();
                    
                    popup.style.display = 'block';
                    popup.style.left = (markerRect.left - rect.left - popup.offsetWidth/2 + markerRect.width/2) + 'px';
                    popup.style.top = (markerRect.top - rect.top - popup.offsetHeight - 10) + 'px';
                    popup.innerHTML = createPopupContent(country);
                });

                map.addOverlay(marker);
            });

            // 点击其他地方关闭弹窗
            map.on('click', function(evt) {
                if (!evt.target.getElement() || !evt.target.getElement().classList.contains('bar-chart')) {
                    popup.style.display = 'none';
                }
            });

        } catch (error) {
            console.error(error);
        }
    </script>
</body>
</html>
