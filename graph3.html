<!DOCTYPE html>
<html>
<head>
    <title>地图柱状图混合可视化</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 800px; }
        .bar-chart { background: rgba(255,255,255,0.9); padding: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .bar { transition: height 0.3s; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // 地理坐标与数据绑定
        const countries = [
            { name: "中国", lat: 35.8617, lng: 104.1954, 
              data: [[45778.4, 58368.0], [43.9, 45.6]] },
            { name: "日本", lat: 36.2048, lng: 138.2529, 
              data: [[14666.0, 16449.3], [13.77, 11.6]] },
            { name: "韩国", lat: 36.5582, lng: 127.7902, 
              data: [[10449.6, 12741.1], [10.0, 9.8]] },
            { name: "新加坡", lat: 1.3521, lng: 103.8198, 
              data: [[7493.1, 8976.2], [7.2, 6.9]] },
            { name: "越南", lat: 14.0583, lng: 108.2772, 
              data: [[5180.5, 6894.0], [5.0, 5.3]] },
            { name: "澳大利亚", lat: -25.2744, lng: 133.7751, 
              data: [[4924.0, 6586.1], [4.7, 5.1]] }
        ];


        // 初始化地图
        const map = L.map('map').setView([15, 110], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 创建动态比例尺
        const maxTrade = d3.max(countries.flatMap(c => c.data[0]));
        const scale = d3.scaleLinear()
            .domain([0, maxTrade])
            .range([10, 40]);

        // 创建柱状图生成器（精准定位版）
        function createBarChart(data) {
            const container = d3.create("div").classed("bar-chart", true);
            const svgWidth = 80;
            const barWidth = 25;
            const barSpacing = 5;

            const svg = container.append("svg")
                .attr("width", svgWidth)
                .attr("height", 100);

            // 计算柱体位置
            const xPositions = [
                (svgWidth - (barWidth*2 + barSpacing)) / 2,
                (svgWidth - (barWidth*2 + barSpacing)) / 2 + barWidth + barSpacing
            ];

            // 绘制柱状图
            svg.selectAll("rect")
                .data(data[0])
                .enter()
                .append("rect")
                .attr("x", (d,i) => xPositions[i])
                .attr("y", d => 60 - scale(d))
                .attr("width", barWidth)
                .attr("height", d => scale(d))
                .attr("fill", (d,i) => i===0 ? "#1f77b4" : "#ff7f0e");

            // 精准定位市场份额标注
            svg.append("text")
                .attr("x", xPositions[0] + barWidth/2)
                .attr("y", 85)
                .attr("text-anchor", "middle")
                .attr("class", "data-label")
                .style("fill", "#1f77b4")
                .text(`${data[1][0]}%`);

            svg.append("text")
                .attr("x", xPositions[1] + barWidth/2)
                .attr("y", 85)
                .attr("text-anchor", "middle")
                .attr("class", "data-label")
                .style("fill", "#ff7f0e")
                .text(`${data[1][1]}%`);

            return container.node();
        }

        // 添加地图标记（保持原有代码）
        countries.forEach(country => {
            L.marker([country.lat, country.lng], {
                icon: L.divIcon({
                    className: 'dynamic-bar',
                    html: createBarChart(country.data).outerHTML,
                    iconSize: [80, 100]
                })
            })
             .bindPopup(createPopupContent(country)) 
            .addTo(map);
        });

 // 生成弹窗内容
        function createPopupContent(country) {
            return `
                <div style="min-width: 180px">
                    <h4>${country.name}</h4>
                    <table>
                        <tr>
                            <th>年份</th>
                            <th>贸易额（亿美元）</th>
                            <th>份额</th>
                        </tr>
                        <tr>
                            <td>2019</td>
                            <td>${country.data[0][0].toLocaleString()}</td>
                            <td>${country.data[1][0]}%</td>
                        </tr>
                        <tr>
                            <td>2023</td>
                            <td>${country.data[0][1].toLocaleString()}</td>
                            <td>${country.data[1][1]}%</td>
                        </tr>
                    </table>
                </div>
            `;
        }

        // 新版图例（增强版）
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = () => {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4 style="margin:5px 0">图例说明</h4>
                <div style="display:flex; align-items:center; margin:4px 0">
                    <div style="background:#1f77b4; width:20px; height:15px;"></div>
                    <span style="margin-left:8px">2019年贸易额</span>
                </div>
                <div style="display:flex; align-items:center; margin:4px 0">
                    <div style="background:#ff7f0e; width:20px; height:15px;"></div>
                    <span style="margin-left:8px">2023年贸易额</span>
                </div>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
